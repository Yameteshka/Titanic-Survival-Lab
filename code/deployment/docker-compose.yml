services:
  api:
    build:
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    image: titanic-survival-api:latest
    container_name: titanic-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    image: titanic-survival-app:latest
    container_name: titanic-app
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
